[project]
name = "vulnhound"
version = "0.1.0"
description = "A web vulnerability scanner for authorised targets only"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vulnhound = "vulnhound.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vulnhound"]